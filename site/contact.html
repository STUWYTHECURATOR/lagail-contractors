<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAGAIL CONTRACTORS</title><meta name="description" content="Professional welding, air conditioning, electrical, plumbing, building and maintenance in Lusaka, Zambia.">
<link rel="icon" href="images/logo.png"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="contact"><div id="hdr"></div><main id="app"><section class="section"><div class="container"><div class="center"><h2>Contact <span class="g">Us</span></h2></div><p class="sub" id="tag"></p>
<div class="two"><form id="enq" name="enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="card b">
<input type="hidden" name="form-name" value="enquiry"><p class="hp"><label>Leave empty <input name="bot-field"></label></p>
<h3>Send an Enquiry</h3><div id="msg"></div>
<label>Full Name *<input name="name" required maxlength="100"></label><label>Email *<input type="email" name="email" required></label>
<label>Phone<input type="tel" name="phone" maxlength="20"></label><label>Service Required *<select name="service_required" id="svc" required></select></label>
<label>Your Message *<textarea name="message" required maxlength="5000" placeholder="Tell us about the job, location and deadlines..."></textarea></label>
<button class="btn btn-p" type="submit">Send Enquiry</button></form><div id="info"></div></div></div></section></main><div id="ftr"></div><script src="js/main.js"></script></body></html>
